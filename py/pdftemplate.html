<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    // 设置 worker 路径 (必须)
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<style>
    /* 外层容器：限制最大宽度，模拟文章阅读体验 */
    .pdf-wrapper {
        max-width: 1000px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
        /* 关键点：这里不设固定高度，让内容自然撑开 */
        width: 100%; 
        box-sizing: border-box;
    }

    /* 每一页的容器 */
    .pdf-page-container {
        width: 100%;
        margin-bottom: 20px; /* 页与页之间的间距 */
        display: flex;
        justify-content: center; /* 让 PDF 居中 */
    }

    /* 渲染出来的 Canvas */
    canvas {
        width: 100% !important; /* 强制宽度占满容器 */
        height: auto !important; /* 高度自动保持比例 */
        display: block;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* 加载中的提示 */
    .loading {
        text-align: center;
        padding: 50px;
        color: #666;
    }
</style>
<!-- PDF 容器 -->
<div id="pdf-wrapper" class="pdf-wrapper">
    <div class="loading">正在加载 PDF...</div>
</div>


<script>
    const url = '{{path}}'; // 你的 PDF 路径
    const container = document.getElementById('pdf-wrapper');

    // 加载 PDF 文档
    pdfjsLib.getDocument(url).promise.then(function(pdfDoc) {
        // 清空加载提示
        container.innerHTML = '';

        // 遍历所有页面
        const totalPages = pdfDoc.numPages;
        
        // 使用 Promise 链确保页面按顺序渲染
        let pageNum = 1;
        
        function renderPage(pageNum) {
            pdfDoc.getPage(pageNum).then(function(page) {
                // 1. 创建容器和 Canvas
                const pageContainer = document.createElement('div');
                pageContainer.className = 'pdf-page-container';
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                pageContainer.appendChild(canvas);
                container.appendChild(pageContainer);

                // 2. 计算缩放比例 (Fit to Width)
                // 获取容器的实际显示宽度 (减去一点 padding 防止溢出)
                // 注意：这里需要在 DOM 渲染后获取宽度，或者使用 clientWidth
                const containerWidth = pageContainer.clientWidth; 
                
                // 获取 PDF 原始视口
                const unscaledViewport = page.getViewport({ scale: 0.5 });
                
                // 计算缩放比：容器宽度 / PDF 原始宽度
                const scale = containerWidth / unscaledViewport.width;
                
                // 获取缩放后的视口
                const viewport = page.getViewport({ scale: scale });

                // 3. 设置 Canvas 尺寸
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                // 4. 渲染
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                const renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    // 当前页渲染完成，渲染下一页
                    if (pageNum < totalPages) {
                        pageNum++;
                        renderPage(pageNum);
                    }
                });
            });
        }

        // 开始渲染第一页
        // 为了确保获取到正确的 clientWidth，稍微延迟一下或使用 requestAnimationFrame
        requestAnimationFrame(() => {
            renderPage(1);
        });

    }, function (reason) {
        console.error('PDF 加载失败: ', reason);
        container.innerHTML = '<p style="color:red">PDF 加载失败：' + reason + '</p><p>请检查控制台 (F12) 确认路径是否正确，以及是否使用了本地服务器 (http://) 而不是直接打开文件 (file://)。</p>';
    });
    
    // 可选：窗口大小改变时重新渲染以适应新宽度
    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            container.innerHTML = '<div class="loading">重新调整大小...</div>';
            // 简单粗暴：重新加载整个文档（生产环境可优化为只重绘）
            location.reload(); 
        }, 300);
    });
</script>
